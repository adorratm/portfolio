name: Deploy Portfolio

# Build images on GitHub runners → GHCR, then SSH pull + recreate.
# Never docker-build Next/Nest on the shared Hetzner VPS (causes sibling 502).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/portfolio

jobs:
  build:
    name: Build images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.emrekilic.web.tr/api/v1
              NEXT_PUBLIC_SITE_URL=https://emrekilic.web.tr
              NEXT_PUBLIC_GA_MEASUREMENT_ID=G-LX5ZQR64J0
          - service: admin
            dockerfile: admin/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.emrekilic.web.tr/api/v1
              NEXT_PUBLIC_WS_URL=https://api.emrekilic.web.tr
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: meta
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # GHCR rejects mixed-case names; normalize once for tags + job output
          prefix="$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=portfolio-${{ matrix.service }}
          cache-from: type=gha,scope=portfolio-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=portfolio-${{ matrix.service }}
          provenance: false

      - name: Verify pushed image ${{ matrix.service }}
        run: |
          set -euo pipefail
          img="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}"
          docker buildx imagetools inspect "$img"
          echo "OK: $img"

  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Sync deploy scripts + compose to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          tar czf /tmp/portfolio-deploy.tar.gz \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            --exclude='**/dist' \
            package.json yarn.lock .yarnrc.yml .yarn .dockerignore \
            backend/Dockerfile frontend/Dockerfile admin/Dockerfile \
            deploy docker-compose.prod.yml

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            /tmp/portfolio-deploy.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/portfolio-deploy.tar.gz"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && tar xzf /tmp/portfolio-deploy.tar.gz && rm -f /tmp/portfolio-deploy.tar.gz"

      - name: Pull images + deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          envs: PORTFOLIO_IMAGE_TAG,PORTFOLIO_IMAGE_PREFIX
          # GHCR auth: expand secrets on the runner (${{ }}) before SSH.
          # Prefer classic PAT secret GHCR_TOKEN (read:packages) — GITHUB_TOKEN
          # often gets "denied" on remote VPS pulls for private/unlinked packages.
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x deploy/*.sh deploy/lib/*.sh 2>/dev/null || chmod +x deploy/*.sh

            GHCR_USER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            GHCR_PASS='${{ secrets.GHCR_TOKEN }}'
            if [[ -z "${GHCR_PASS}" ]]; then
              GHCR_PASS='${{ secrets.GITHUB_TOKEN }}'
            fi
            docker logout ghcr.io 2>/dev/null || true
            printf '%s\n' "${GHCR_PASS}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export PORTFOLIO_IMAGE_TAG="${PORTFOLIO_IMAGE_TAG:-${{ github.sha }}}"
            export PORTFOLIO_IMAGE_PREFIX="${PORTFOLIO_IMAGE_PREFIX:-ghcr.io/${{ github.repository_owner }}/portfolio}"
            export PORTFOLIO_IMAGE_PREFIX="$(echo "${PORTFOLIO_IMAGE_PREFIX}" | tr '[:upper:]' '[:lower:]')"
            export PORTFOLIO_USE_REGISTRY=1
            ./deploy/deploy.sh
        env:
          PORTFOLIO_IMAGE_TAG: ${{ needs.build.outputs.image_tag || github.sha }}
          PORTFOLIO_IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            API_PORT="$(grep '^API_HOST_PORT=' deploy/.env | cut -d= -f2)"
            API_PORT="${API_PORT:-3102}"

            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null 2>&1; then
                echo "==> Backend OK (${i}. deneme)"
                curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health"
                echo ""
                break
              fi
              if [[ "$i" -eq 20 ]]; then
                echo "==> Backend logları:"
                docker logs portfolio-prod-backend --tail 100 2>&1 || true
                exit 1
              fi
              echo "Bekleniyor... (${i}/20)"
              sleep 3
            done

            curl -fsS -o /dev/null -w "Frontend HTTP %{http_code}\n" http://127.0.0.1:3100/tr
